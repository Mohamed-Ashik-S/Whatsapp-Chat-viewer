plugins {
    id 'com.android.application'
}

android {
    namespace 'app.chatarchive'
    compileSdk 34

    defaultConfig {
        applicationId 'app.chatarchive'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Do not compress the bundled web files, so they load faster.
    androidResources {
        noCompress 'js', 'css', 'html'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
